<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>振り返り一覧へ移動しています...</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
      color: #475569;
    }
    .msg { text-align: center; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>振り返り一覧へ移動しています...</p>
    <p id="fallback" style="font-size:0.85em; display:none;">
      自動で移動しない場合は <a id="fallback-link" href="#">こちら</a> をクリックしてください。
    </p>
  </div>

  <script>
    // ここに外部WebアプリのURL（デプロイURル）を設定してください
    var EXTERNAL_APP_URL = "https://script.google.com/macros/s/AKfycbzUB8QWFhq_4gBvz1XnQxGTgBC7L9LaieoqKvuhd6q3d2vKjzXluTRiF8YYnBhn2l6CsQ/exec";

    // ここにシークレットキーを設定してください
    // ※ このファイルは公開リポジトリに置かれる可能性があるため、下部の【重要】もあわせてご確認ください
    var SHARED_SECRET = "if8Wf6qz_WQ*VyXNDzvi8NHWUJ3B3a29";

    // このページ自体に付けられたクエリパラメータ（例: ?date=2026-08-08）があれば、
    // そのまま転送先にも引き継ぐ
    var extraParams = window.location.search.replace(/^\?/, "");

    var targetUrl = EXTERNAL_APP_URL + "?key=" + encodeURIComponent(SHARED_SECRET);
    if (extraParams) {
      targetUrl += "&" + extraParams;
    }

    document.getElementById("fallback-link").href = targetUrl;

    // 0.3秒ほど待ってからリダイレクト（真っ白な瞬間を避けるための演出）
    setTimeout(function () {
      window.location.href = targetUrl;
    }, 300);

    // 2秒たっても遷移していなければ、手動リンクを表示する
    setTimeout(function () {
      document.getElementById("fallback").style.display = "block";
    }, 2000);
  </script>
</body>
</html>
